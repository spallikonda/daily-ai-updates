<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily AI Updates</title>
  <style>
    body { 
      font-family: system-ui, sans-serif; 
      max-width: 900px; 
      margin: 40px auto; 
      padding: 20px; 
      line-height: 1.6; 
    }
    h1 { color: #0f172a; }
    .card { 
      background: #f8fafc; 
      padding: 25px; 
      border-radius: 12px; 
      margin: 20px 0; 
      border: 1px solid #e2e8f0;
    }
    a { color: #2563eb; font-weight: 500; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>🚀 Daily AI Updates</h1>
  <p>From Top AI Companies • Updated every weekday at 8 PM IST</p>

  <div class="card">
    <h2>📅 Today's Update</h2>
    <p><strong>Download PDF:</strong> 
      <a id="today-pdf" href="#">Loading...</a>
    </p>
  </div>

  <p>
    <a href="https://github.com/spallikonda/daily-ai-updates/tree/main/summaries" target="_blank">
      📂 View All Past Summaries
    </a>
  </p>

  <script>
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    const dateStr = `${year}-${month}-${day}`;

    const link = document.getElementById('today-pdf');
    link.href = `summaries/${dateStr}.md`;
    link.textContent = `${dateStr}.md`;
  </script>
</body>
</html>
