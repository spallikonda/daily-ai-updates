<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily AI Updates</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    h1 { color: #1f2937; }
    .update { background: #f8fafc; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    a { color: #3b82f6; text-decoration: none; }
    .footer { text-align: center; margin-top: 50px; color: #64748b; }
  </style>
</head>
<body>
  <h1>🚀 Daily AI Updates Archive</h1>
  <p>Latest summaries from top AI companies. Updated every weekday at 8 PM IST.</p>

  <div id="latest">
    <h2>📅 Latest Update</h2>
    <!-- Latest PDF will be injected by JS or manually updated -->
    <p><strong>Today’s PDF:</strong> <a href="summaries/$(date +%Y-%m-%d).pdf" id="today-pdf">Download PDF</a></p>
  </div>

  <h2>📚 All Summaries</h2>
  <ul id="archive-list">
    <!-- GitHub will list folders, or you can enhance with JS -->
  </ul>

  <div class="footer">
    Made with ❤️ for Srinivas • <a href="https://github.com/YOUR-USERNAME/daily-ai-updates">GitHub Repo</a>
  </div>
</body>
</html>
