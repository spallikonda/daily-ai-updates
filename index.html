<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily AI Updates</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    h1 { color: #0f172a; }
    .card { background: #f8fafc; padding: 24px; border-radius: 12px; margin-bottom: 24px; border: 1px solid #e2e8f0; }
    a { color: #3b82f6; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>🚀 Daily AI Updates</h1>
  <p>Latest summaries from top AI companies • Updated every weekday at 8 PM IST</p>

  <div class="card">
    <h2>📅 Today's Update</h2>
    <p><strong>Download Today's PDF:</strong> 
      <a id="today-pdf" href="#">Loading...</a>
    </p>
  </div>

  <div class="footer">
    <a href="https://github.com/spallikonda/daily-ai-updates">GitHub Repo</a>
  </div>

  <script>
    const today = new Date();
    const dateStr = today.getFullYear() + '-' + 
                    String(today.getMonth() + 1).padStart(2, '0') + '-' + 
                    String(today.getDate()).padStart(2, '0');
    
    const link = document.getElementById('today-pdf');
    link.href = `summaries/${dateStr}.pdf`;
    link.textContent = `${dateStr}.pdf`;
  </script>
</body>
</html>
