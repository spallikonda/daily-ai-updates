name: Daily AI Updates Summary

on:
  schedule:
    - cron: '30 14 * * 1-5'  # Weekdays at ~8 PM IST
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6   # ← Updated to v6 (Node 24)

      - name: Set up Python
        uses: actions/setup-python@v6   # ← Updated to v6 (Node 24)
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Summary
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: python generate_summary.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summaries/ pdfs/ || true
          git commit -m "Daily AI Update: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4   # Latest stable (v4.1.0+)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
